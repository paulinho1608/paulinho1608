# ==============================================
# UNION - server.cfg (produção)
# ==============================================
sv_hostname "UNION RP | Mundo Vivo"
sv_maxclients 128
sv_endpointprivacy true
sets sv_projectName "UNION"
sets sv_projectDesc "Servidor RP americano, mundo vivo e sistêmico"
sets locale "pt-BR"

# Conectividade
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# OneSync e segurança
set onesync on
sv_authMaxVariance 1
sv_authMinTrust 5
sv_enforceGameBuild 2944
sv_scriptHookAllowed 0
sv_requestParanoia 3

# Chat e execução
setr chat_disableNUI "1"
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true

# Banco de dados
setr database_connection "mysql://union:union@127.0.0.1/union"
setr database_slow_query_ms "150"
setr database_pool "10"

# Configurações base
exec config/permissions.cfg
exec config/logging.cfg
exec config/economy.cfg
exec config/inventory.cfg
exec config/medical.cfg
exec config/communication.cfg
exec config/world.cfg
exec config/illegal.cfg
exec config/leisure.cfg
exec config/needs.cfg
exec config/vehicles.cfg
exec config/tuning.cfg
exec config/balance.cfg
exec config/identity.cfg
exec config/jobs.cfg
exec config/police.cfg
exec config/hospital.cfg
exec config/mechanic.cfg
exec config/database.cfg

# Recursos
ensure union-base
ensure union-inventory
ensure union-jobs
ensure union-medical
ensure union-vehicles
ensure union-world-memory
ensure union-narratives
ensure union-autobalance
ensure union-drugs
ensure union-arms
ensure union-chopshop
ensure union-smuggling
ensure union-hud
ensure union-phone
ensure union-tablet
ensure union-logo
ensure union-loadscreen

# ==================================================
# Observação: este arquivo assume que os recursos
# estão organizados conforme a proposta de pastas.
# ==================================================
